name: Update Kitty

# Refreshes are aligned to when matches actually finish. The tournament is in the
# US, so kickoffs (≈12/3/6/9pm ET) land overnight in India and the last game wraps
# around 08:30 IST. Times below are UTC, with the IST equivalent noted.
on:
  schedule:
    - cron: "0 19 * * *"    # 00:30 IST — after the 1st evening match
    - cron: "0 22 * * *"    # 03:30 IST — after the 2nd
    - cron: "0 1 * * *"     # 06:30 IST — after the 3rd
    - cron: "30 4 * * *"    # 10:00 IST — after the last (incl. extra time): the key morning refresh
    - cron: "0 8 * * *"     # 13:30 IST — midday safety net / catches any late finisher
    - cron: "0 13 * * *"    # 18:30 IST — evening: refreshes "next up" before the night's games
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab

permissions:
  contents: write           # allows the action to commit the refreshed data.json

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch results and rebuild data.json
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/update.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render WhatsApp preview card (non-blocking)
        continue-on-error: true
        run: |
          python -m pip install --quiet pillow
          python scripts/og.py

      - name: Commit if anything changed
        if: always()
        run: |
          git config user.name  "kitty-bot"
          git config user.email "kitty-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain data.json index.html og.png)" ]; then
            git add data.json index.html og.png
            git commit -m "Auto-update: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes."
          fi
